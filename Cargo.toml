[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "crowsi-independent-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Independent signed read-back and intrusion evidence verifier for Crowsi"
license = "Apache-2.0"
readme = "README.md"
publish = ["ecosystem-private"]
repository = "https://github.com/crowsi-net/crowsi-independent-verifier"

[package.metadata.crowsi]
external-actions = false
independent-observation = true

[workspace]
members = ["."]
resolver = "3"

[dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
